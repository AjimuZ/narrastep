[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "narrastep-backend"
version = "0.2.0"
description = "Local-first Narrastep processing API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "celery==5.6.3",
  "fastapi==0.139.0",
  "faster-whisper==1.2.1",
  "numpy==2.4.6",
  "opencv-python-headless==4.13.0.92",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "python-multipart==0.0.22",
  "redis==6.4.0",
  "sqlalchemy==2.0.51",
  "swagger-ui-bundle==1.1.0",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: opt-in test requiring FFmpeg, espeak-ng, and a local Whisper model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
