[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "narrastep-backend"
version = "0.2.0"
description = "Local-first Narrastep processing API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.1",
  "celery[redis]==5.6.3",
  "fastapi==0.162.0",
  "faster-whisper==1.2.1",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "pillow==13.0.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "sqlalchemy==2.1.6",
  "swagger-ui-bundle==1.1.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "editables==0.6",
  "httpx==0.28.1",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "uv==0.13.6",
]

[dependency-groups]
build = [
  "hatchling==1.33.0",
  "pip==26.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: opt-in test requiring FFmpeg, espeak-ng, and a local Whisper model"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
