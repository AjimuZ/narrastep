name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m ruff format --check backend
      - run: python -m ruff check backend
      - run: python -m mypy --config-file backend/pyproject.toml backend/app
      - run: python -m pytest backend

  contracts:
    runs-on: ubuntu-latest
    env:
      NARRASTEP_ENV: test
      NARRASTEP_DATA_DIR: ${{ runner.temp }}/narrastep-data
      NARRASTEP_DATABASE_URL: sqlite:///${{ runner.temp }}/narrastep-contracts.db
      NARRASTEP_ENABLE_MOCK_PROCESSING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "./backend[dev]"
      - run: python scripts/check_docs.py
      - run: python scripts/export_openapi.py --check

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: NARRASTEP_WHISPER_MODEL=tiny docker compose build

  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NARRASTEP_ENV: test
      NARRASTEP_ENABLE_MOCK_PROCESSING: "true"
      NARRASTEP_E2E_MOCK_CONFIRMED: "true"
      NARRASTEP_WHISPER_MODEL: tiny
      NARRASTEP_MIN_FREE_DISK_MB: 64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: cp .env.example .env
      - run: docker compose --project-name narrastep-fullstack up --build --detach --wait
      - name: Wait for API dependencies
        run: |
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent --show-error http://127.0.0.1:8002/api/v1/health || true)"
            if echo "$health" | grep --quiet '"database":"ok"' \
              && echo "$health" | grep --quiet '"redis":"ok"' \
              && echo "$health" | grep --quiet '"worker":"ok"'; then
              echo "$health"
              exit 0
            fi
            sleep 2
          done
          echo "Narrastep dependencies did not become ready in time."
          exit 1
      - run: npm run e2e:fullstack
        working-directory: apps/web
      - if: failure()
        run: docker compose --project-name narrastep-fullstack logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-playwright-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose --project-name narrastep-fullstack down --volumes --remove-orphans
